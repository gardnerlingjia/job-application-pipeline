
services:
  postgres:
    image: postgres:17
    container_name: job_pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_pipeline
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


