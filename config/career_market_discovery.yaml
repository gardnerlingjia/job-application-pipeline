location_policy:
  preferred:
    - Berlin
    - Potsdam
  acceptable:
    - Remote Germany
    - Germany-wide with limited travel
  excluded:
    - relocation to Munich
    - relocation to China
  broad_profiles_do_not_hard_filter_location: true
seniority_policy:
  preferred:
    - Senior
    - Lead
    - Principal
    - Program Manager
    - Product Manager
    - Strategy
    - Operations
  avoid:
    - Junior
    - Graduate
    - Intern
profiles:
